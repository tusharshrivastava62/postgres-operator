apiVersion: db.youroperator.io/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: postgres-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgrescluster-sample
spec:
  instances: 3
  version: "17"
  storage:
    size: 1Gi
  # Backups are off here because they need a bucket and a credentials Secret.
  # See db_v1alpha1_postgrescluster_backup.yaml for a cluster that uses them.
  backup:
    enabled: false
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      memory: "1Gi"
