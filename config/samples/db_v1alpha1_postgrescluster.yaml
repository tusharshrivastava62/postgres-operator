apiVersion: db.youroperator.io/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: postgres-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgrescluster-sample
spec:
  instances: 3
  version: "17"
  # Remove this line once the project's own images are published; until then
  # point at an upstream Spilo image.
  image: ghcr.io/zalando/spilo-17:4.0-p3
  storage:
    size: 1Gi
  backup:
    enabled: true
    schedule: "0 2 * * *"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      memory: "1Gi"
