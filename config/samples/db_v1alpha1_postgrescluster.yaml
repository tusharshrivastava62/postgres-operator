apiVersion: db.db.youroperator.io/v1alpha1
kind: PostgresCluster
metadata:
  labels:
    app.kubernetes.io/name: postgres-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgrescluster-sample
spec:
  instances: 3
  version: "16"
  storage:
    size: 1Gi
  backup:
    enabled: true
    schedule: "0 2 * * *"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
