---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-db-youroperator-io-v1alpha1-postgresemergencyaccess
  failurePolicy: Fail
  name: mpostgresemergencyaccess-v1alpha1.kb.io
  rules:
  - apiGroups:
    - db.youroperator.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - postgresemergencyaccesses
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-db-youroperator-io-v1alpha1-postgrescluster
  failurePolicy: Fail
  name: vpostgrescluster-v1alpha1.kb.io
  rules:
  - apiGroups:
    - db.youroperator.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - postgresclusters
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-db-youroperator-io-v1alpha1-postgresemergencyaccess
  failurePolicy: Fail
  name: vpostgresemergencyaccess-v1alpha1.kb.io
  rules:
  - apiGroups:
    - db.youroperator.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - postgresemergencyaccesses
  sideEffects: None
