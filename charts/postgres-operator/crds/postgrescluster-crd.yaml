                            maxLength: 512
                            pattern: ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$
                            type: string
                            x-kubernetes-validations:
                            - message: path must not contain . or .. segments
                              rule: '!self.split(''/'').exists(s, s == ''.'' || s
                                == ''..'')'
                          region:
                            description: region is the bucket's region. Leave it unset
                              for stores that have none.
                            maxLength: 64
                            type: string
                          type:
                            default: s3
                            description: |-
                              type is the kind of store. Only "s3" is supported; it covers Amazon S3
                              and any store that speaks its API.
                            enum:
                            - s3
                            type: string
                        required:
                        - bucket
                        - credentialsSecret
                        type: object
                      encryption:
                        description: |-
                          encryption names the key the source's backups were encrypted with, if
                          they were. It is independent of this cluster's own backup encryption.
                        properties:
                          keySecret:
                            description: |-
                              keySecret names a Secret in the cluster's namespace whose
                              "libsodium-key" entry holds a 32-byte key written as 64 hexadecimal
                              characters. The operator never creates or changes it.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - keySecret
                        type: object
                      sourceCluster:
                        description: sourceCluster is the name the backups were taken
                          under.
                        maxLength: 63
                        minLength: 1
                        type: string
                      sourceNamespace:
                        description: |-
                          sourceNamespace is the namespace the source cluster ran in. It
