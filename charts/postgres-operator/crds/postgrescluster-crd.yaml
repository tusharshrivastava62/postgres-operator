                        maxLength: 256
                        pattern: ^\S+\s+\S+\s+\S+\s+\S+\s+\S+$
                        type: string
                    type: object
                type: object
              bootstrap:
                description: |-
                  bootstrap says how the cluster's data is first created. Leave it unset
