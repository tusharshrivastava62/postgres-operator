                    - credentialsSecret
                    type: object
                  enabled:
                    description: |-
                      enabled turns backups on. WAL archiving starts as soon as it is set;
                      base backups then run on schedule. It requires destination.
                    type: boolean
                  encryption:
                    description: encryption encrypts backups and WAL before they leave
                      the pod.
                    properties:
